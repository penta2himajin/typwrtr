[package]
name = "typwrtr-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Typwrtr session core — euhadra pipeline + PTT state for the macOS shell"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "typwrtr_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
async-trait = "0.1"
euhadra = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
uniffi = { version = "0.29", features = ["cli"] }

[dev-dependencies]
euhadra = { workspace = true, features = ["testing"] }
