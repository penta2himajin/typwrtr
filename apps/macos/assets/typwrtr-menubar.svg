<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Typwrtr menu bar icon</title>
  <desc id="desc">A frameless monochrome typewriter with a wide microphone head.</desc>

  <!-- Cutouts stay transparent when macOS tints this as a template image. -->
  <mask id="cutouts">
    <rect width="64" height="64" fill="#fff"/>
    <g fill="#000">
      <rect x="27" y="13" width="10" height="2.5" rx="1.25"/>
      <rect x="27" y="18" width="10" height="2.5" rx="1.25"/>
      <rect x="28" y="23" width="8" height="2.5" rx="1.25"/>

      <circle cx="18" cy="47" r="1.6"/>
      <circle cx="25" cy="47" r="1.6"/>
      <circle cx="32" cy="47" r="1.6"/>
      <circle cx="39" cy="47" r="1.6"/>
      <circle cx="46" cy="47" r="1.6"/>
      <rect x="20" y="53" width="24" height="2.5" rx="1.25"/>
    </g>
  </mask>

  <!-- Template artwork: solid black on transparent background. -->
  <g fill="#000" mask="url(#cutouts)">
    <!-- Wide microphone -->
    <rect x="23" y="3" width="18" height="29" rx="9"/>
    <rect x="30" y="29" width="4" height="9" rx="1.5"/>

    <!-- Carriage and side knobs -->
    <rect x="8" y="34" width="48" height="5" rx="2"/>
    <rect x="5" y="35" width="4" height="4" rx="1"/>
    <rect x="55" y="35" width="4" height="4" rx="1"/>

    <!-- Simplified typewriter body -->
    <path d="M12 32h10c2 4 5 6 9 7h2c4-1 7-3 9-7h10l6 19v3c0 5-3 7-8 7H14c-5 0-8-2-8-7v-3z"/>
  </g>

</svg>
